<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel Admin · Web1 &amp; Web2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D2B4E'/%3E%3Cpath d='M9 22V10h4.5a3.5 3.5 0 0 1 0 7H9' fill='none' stroke='%23FF6F3C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='20' r='3' fill='%234FC3F7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6V4h16v2M9 20h6M12 4v16"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h6M7 13h10M7 16h4"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1.5"/><path d="M5 13v7h14v-7M12 8v12M12 8S10.5 3 8 4.2 9 8 12 8Zm0 0s1.5-5 4-3.8S15 8 12 8Z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 10h4a1 1 0 0 1 1 1v10M2 21h20M8 8h3M8 12h3M8 16h3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A16.6 16.6 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3ZM12 10v4M12 17h.01"/></symbol>
</svg>

<!-- ===== LOGIN ===== -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand brand-dark">
      <span class="brand-mark">P</span>
      <span>Panel Admin<small>Web1 · Web2</small></span>
    </div>
    <h1>Masuk ke panel</h1>
    <p class="muted">Kelola teks dan kartu promosi CentrinOnline &amp; M3 Internet.</p>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus />
    </label>
    <p class="form-error" id="loginError" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    <p class="hint" id="loginHint" hidden>Password awal: <code>admin123</code>. Segera ganti setelah masuk.</p>
  </form>
</section>

<!-- ===== APLIKASI ===== -->
<div class="app" id="appView" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <span>Panel Admin<small>Web1 · Web2</small></span>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Menu admin"></nav>
    <button class="side-logout" type="button" id="logoutBtn">
      <svg aria-hidden="true"><use href="#i-logout"/></svg>Keluar
    </button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Buka menu">
        <svg aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar-title">
        <p class="crumb" id="crumb"></p>
        <h1 id="pageTitle">Ringkasan</h1>
      </div>
      <span class="save-state" id="saveState" data-state="idle"></span>
      <a class="btn btn-ghost" id="viewSiteBtn" href="../Web1/index.html" target="_blank" rel="noopener" hidden>
        <svg aria-hidden="true"><use href="#i-external"/></svg><span>Lihat halaman</span>
      </a>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- ===== MODAL EDITOR KARTU ===== -->
<dialog class="modal modal-wide" id="editorModal">
  <form method="dialog" class="modal-inner" id="editorForm" novalidate>
    <header class="modal-head">
      <h2 id="editorTitle">Edit kartu</h2>
      <button class="icon-btn" type="button" data-close aria-label="Tutup"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="editor-body">
      <div class="editor-fields" id="editorFields"></div>
      <aside class="editor-preview">
        <p class="preview-label">Pratinjau</p>
        <div id="editorPreview"></div>
      </aside>
    </div>
    <footer class="modal-foot">
      <p class="form-error" id="editorError" role="alert"></p>
      <button class="btn btn-ghost" type="button" data-close>Batal</button>
      <button class="btn btn-primary" type="submit" id="editorSubmit">Simpan</button>
    </footer>
  </form>
</dialog>

<!-- ===== MODAL KONFIRMASI ===== -->
<dialog class="modal" id="confirmModal">
  <div class="modal-inner">
    <div class="confirm-body">
      <span class="confirm-icon"><svg aria-hidden="true"><use href="#i-alert"/></svg></span>
      <div>
        <h2 id="confirmTitle">Hapus item?</h2>
        <p class="muted" id="confirmText"></p>
      </div>
    </div>
    <footer class="modal-foot">
      <button class="btn btn-ghost" type="button" data-answer="no">Batal</button>
      <button class="btn btn-danger" type="button" data-answer="yes" id="confirmYes">Hapus</button>
    </footer>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
